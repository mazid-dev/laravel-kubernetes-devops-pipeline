  tag: latest
  pullPolicy: IfNotPresent

namespace: laravel

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: laravel-test.local

persistence:
  enabled: false
  size: 1Gi

configmap:
  APP_ENV: production
  APP_DEBUG: "false"

